<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多相睡眠ナップタイマー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-950 min-h-screen text-white">
<div class="max-w-2xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-indigo-300 mb-1">多相睡眠ナップタイマー</h1>
  <p class="text-indigo-400 text-sm mb-6">スケジュールを選択して次のナップまでのカウントダウンを開始します。</p>

  <!-- スケジュール選択 -->
  <div class="bg-indigo-900 rounded-xl p-4 mb-5">
    <h2 class="text-sm font-semibold text-indigo-300 mb-3">睡眠スケジュール</h2>
    <div class="grid grid-cols-1 gap-2" id="schedule-list"></div>
  </div>

  <!-- 現在のスケジュール情報 -->
  <div class="bg-indigo-800 rounded-xl p-4 mb-5" id="schedule-info"></div>

  <!-- タイマー -->
  <div class="bg-indigo-900 rounded-xl p-6 mb-5 text-center">
    <div class="text-xs text-indigo-400 mb-2" id="next-nap-label">次のナップまで</div>
    <div class="text-6xl font-mono font-bold text-white mb-4" id="timer-display">--:--:--</div>
    <div class="text-sm text-indigo-300 mb-5" id="next-nap-time"></div>
    <div class="flex gap-3 justify-center flex-wrap">
      <button id="btn-start" onclick="startTimer()" aria-label="タイマー開始"
        class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-lg font-semibold">開始</button>
      <button id="btn-pause" onclick="pauseTimer()" aria-label="タイマー一時停止"
        class="bg-yellow-600 hover:bg-yellow-500 text-white px-6 py-2 rounded-lg font-semibold hidden">一時停止</button>
      <button onclick="resetTimer()" aria-label="タイマーリセット"
        class="bg-gray-600 hover:bg-gray-500 text-white px-6 py-2 rounded-lg font-semibold">リセット</button>
    </div>
  </div>

  <!-- スケジュールタイムライン -->
  <div class="bg-indigo-900 rounded-xl p-4 mb-5">
    <h2 class="text-sm font-semibold text-indigo-300 mb-3">24時間スケジュール</h2>
    <div id="timeline" class="space-y-1 text-sm"></div>
  </div>

  <!-- 通知設定 -->
  <div class="bg-indigo-800 rounded-xl p-4 mb-5">
    <div class="flex items-center justify-between">
      <span class="text-sm text-indigo-300">Web通知</span>
      <button onclick="requestNotification()" id="notif-btn"
        class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1 rounded text-sm">通知を許可</button>
    </div>
    <div id="notif-status" class="text-xs text-indigo-400 mt-1"></div>
  </div>
</div>

<script>
const SCHEDULES = [
  {
    id: 'uberman',
    name: 'Uberman',
    desc: '6×20分ナップ / 合計2時間',
    color: 'text-purple-300',
    naps: [
      { time: '00:00', duration: 20 },
      { time: '04:00', duration: 20 },
      { time: '08:00', duration: 20 },
      { time: '12:00', duration: 20 },
      { time: '16:00', duration: 20 },
      { time: '20:00', duration: 20 },
    ]
  },
  {
    id: 'dymaxion',
    name: 'Dymaxion',
    desc: '4×30分ナップ / 合計2時間',
    color: 'text-blue-300',
    naps: [
      { time: '00:00', duration: 30 },
      { time: '06:00', duration: 30 },
      { time: '12:00', duration: 30 },
      { time: '18:00', duration: 30 },
    ]
  },
  {
    id: 'everyman3',
    name: 'Everyman 3',
    desc: '1×3時間コア + 3×20分ナップ / 合計4時間',
    color: 'text-green-300',
    naps: [
      { time: '00:00', duration: 180, label: 'コアスリープ' },
      { time: '06:00', duration: 20 },
      { time: '12:00', duration: 20 },
      { time: '18:00', duration: 20 },
    ]
  },
  {
    id: 'biphasic',
    name: 'Biphasic',
    desc: '1×6時間コア + 1×20分昼寝 / 合計6.3時間',
    color: 'text-orange-300',
    naps: [
      { time: '00:00', duration: 360, label: 'コアスリープ' },
      { time: '14:00', duration: 20, label: '昼寝' },
    ]
  },
];

let selectedSchedule = SCHEDULES[0];
let timerInterval = null;
let isRunning = false;
let targetTime = null;

function loadState() {
  try {
    const s = localStorage.getItem('polyphasic-timer');
    if (s) {
      const d = JSON.parse(s);
      const sc = SCHEDULES.find(x => x.id === d.scheduleId);
      if (sc) selectedSchedule = sc;
    }
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('polyphasic-timer', JSON.stringify({ scheduleId: selectedSchedule.id }));
}

function renderScheduleList() {
  const c = document.getElementById('schedule-list');
  c.innerHTML = '';
  SCHEDULES.forEach(sc => {
    const btn = document.createElement('button');
    const isSelected = sc.id === selectedSchedule.id;
    btn.className = `flex items-center justify-between px-4 py-3 rounded-lg text-left transition ${isSelected ? 'bg-indigo-600' : 'bg-indigo-800 hover:bg-indigo-700'}`;
    btn.setAttribute('aria-label', sc.name + 'スケジュールを選択');
    btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
    const left = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'font-semibold ' + sc.color;
    name.textContent = sc.name;
    const desc = document.createElement('div');
    desc.className = 'text-xs text-indigo-300';
    desc.textContent = sc.desc;
    left.appendChild(name); left.appendChild(desc);
    const check = document.createElement('span');
    check.textContent = isSelected ? '✓' : '';
    check.className = 'text-green-400 font-bold';
    btn.appendChild(left); btn.appendChild(check);
    btn.onclick = () => { selectedSchedule = sc; saveState(); resetTimer(); renderScheduleList(); renderScheduleInfo(); renderTimeline(); };
    c.appendChild(btn);
  });
}

function renderScheduleInfo() {
  const c = document.getElementById('schedule-info');
  const sc = selectedSchedule;
  const totalMin = sc.naps.reduce((s, n) => s + n.duration, 0);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  c.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'font-semibold ' + sc.color + ' mb-1';
  title.textContent = sc.name + ' スケジュール';
  const stats = document.createElement('div');
  stats.className = 'text-xs text-indigo-300';
  stats.textContent = `ナップ数: ${sc.naps.length}回 / 合計睡眠時間: ${h > 0 ? h + '時間' : ''}${m > 0 ? m + '分' : ''}`;
  c.appendChild(title); c.appendChild(stats);
}

function getNowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
}

function parseTime(str) {
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}

function findNextNap() {
  const nowMin = getNowMinutes();
  const sc = selectedSchedule;
  const future = sc.naps.filter(n => parseTime(n.time) > nowMin);
  if (future.length > 0) return future[0];
  return sc.naps[0]; // wrap to next day
}

function getNextNapTargetDate() {
  const nap = findNextNap();
  const now = new Date();
  const [h, m] = nap.time.split(':').map(Number);
  const target = new Date();
  target.setHours(h, m, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  return target;
}

function startTimer() {
  if (isRunning) return;
  targetTime = getNextNapTargetDate();
  isRunning = true;
  document.getElementById('btn-start').classList.add('hidden');
  document.getElementById('btn-pause').classList.remove('hidden');
  timerInterval = setInterval(tick, 1000);
  tick();
}

function pauseTimer() {
  isRunning = false;
  clearInterval(timerInterval);
  document.getElementById('btn-start').classList.remove('hidden');
  document.getElementById('btn-pause').classList.add('hidden');
}

function resetTimer() {
  pauseTimer();
  targetTime = null;
  document.getElementById('timer-display').textContent = '--:--:--';
  document.getElementById('next-nap-time').textContent = '';
}

function tick() {
  if (!targetTime) return;
  const now = new Date();
  let diff = Math.max(0, Math.floor((targetTime - now) / 1000));
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  document.getElementById('timer-display').textContent =
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  const nap = findNextNap();
  document.getElementById('next-nap-time').textContent =
    `次のナップ: ${nap.time}（${nap.duration}分）` + (nap.label ? ' - ' + nap.label : '');
  if (diff === 0) {
    clearInterval(timerInterval);
    isRunning = false;
    sendNotification('ナップ開始！', `${nap.duration}分間のナップ時間です。`);
    setTimeout(() => {
      if (!isRunning) { targetTime = getNextNapTargetDate(); startTimer(); }
    }, nap.duration * 60 * 1000);
  }
}

function renderTimeline() {
  const c = document.getElementById('timeline');
  c.innerHTML = '';
  const sc = selectedSchedule;
  const nowMin = getNowMinutes();
  sc.naps.forEach(n => {
    const napMin = parseTime(n.time);
    const endMin = napMin + n.duration;
    const isPast = endMin < nowMin && napMin < nowMin;
    const isCurrent = napMin <= nowMin && nowMin < endMin;
    const row = document.createElement('div');
    row.className = `flex items-center gap-3 px-3 py-2 rounded ${isCurrent ? 'bg-indigo-600' : isPast ? 'opacity-40' : 'bg-indigo-800'}`;
    const dot = document.createElement('div');
    dot.className = `w-3 h-3 rounded-full flex-shrink-0 ${isCurrent ? 'bg-green-400 animate-pulse' : 'bg-indigo-400'}`;
    const info = document.createElement('div');
    info.className = 'flex-1';
    const timeText = document.createElement('span');
    timeText.className = 'font-mono text-xs text-indigo-200';
    timeText.textContent = n.time;
    const durText = document.createElement('span');
    durText.className = 'ml-2 text-xs text-indigo-300';
    durText.textContent = n.duration + '分' + (n.label ? ' (' + n.label + ')' : '');
    info.appendChild(timeText); info.appendChild(durText);
    const status = document.createElement('span');
    status.className = 'text-xs';
    status.textContent = isCurrent ? '😴 睡眠中' : isPast ? '完了' : '';
    row.appendChild(dot); row.appendChild(info); row.appendChild(status);
    c.appendChild(row);
  });
}

function requestNotification() {
  if (!('Notification' in window)) {
    document.getElementById('notif-status').textContent = '⚠ このブラウザは通知をサポートしていません';
    return;
  }
  Notification.requestPermission().then(p => {
    document.getElementById('notif-status').textContent =
      p === 'granted' ? '✓ 通知が許可されました' : '✗ 通知が拒否されました';
    document.getElementById('notif-btn').textContent = p === 'granted' ? '通知: ON' : '通知を許可';
  });
}

function sendNotification(title, body) {
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    new Notification(title, { body, icon: '' });
  }
}

loadState();
renderScheduleList();
renderScheduleInfo();
renderTimeline();
if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
  document.getElementById('notif-status').textContent = '✓ 通知が許可されています';
}
setInterval(renderTimeline, 60000);
</script>
</body>
</html>
